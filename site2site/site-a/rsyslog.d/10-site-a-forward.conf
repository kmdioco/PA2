module(load="imfile")

input(
    type="imfile"
    File="/var/log/site-a-firewall.log"
    Tag="site-a-firewall:"
    Severity="info"
    Facility="local0"
    PersistStateInterval="100"
)

action(
    type="omfwd"
    Target="198.51.100.10"
    Port="514"
    Protocol="tcp"
    action.resumeRetryCount="-1"
    queue.type="linkedList"
    queue.filename="siteAForward"
)
